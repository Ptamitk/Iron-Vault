name: Frontend quality checks

on:
  push:
    branches:
      - feature/frontend-completion-redux
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint frontend source
        run: npx eslint src
      - name: Build production bundle
        run: npm run build
